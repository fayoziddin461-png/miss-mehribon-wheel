
<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>7-"A" VOCABULARY WHEEL OF NAMES</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    font-family: Arial, sans-serif;
    color: white;
    padding: 25px 15px;
    overflow-x: hidden;
    position: relative;

    background:
        radial-gradient(ellipse at 15% 15%, #263b83 0%, transparent 42%),
        radial-gradient(ellipse at 85% 80%, #51266e 0%, transparent 45%),
        linear-gradient(135deg, #080d24, #111b3b);
    background-size: 150% 150%;
    animation: backgroundMove 16s ease-in-out infinite alternate;
}

@keyframes backgroundMove {
    0% { background-position: 0% 0%; }
    100% { background-position: 100% 100%; }
}

body::before,
body::after {
    content: "";
    position: fixed;
    inset: -30%;
    pointer-events: none;
    z-index: -1;
}

body::before {
    background:
        radial-gradient(ellipse at 25% 35%, #4568dc33, transparent 35%),
        radial-gradient(ellipse at 75% 65%, #9b59b633, transparent 35%);
    filter: blur(35px);
    animation: aurora 18s ease-in-out infinite alternate;
}

body::after {
    opacity: .55;
    background-image:
        radial-gradient(2px 2px at 20px 30px, #ffffffaa 50%, transparent),
        radial-gradient(2px 2px at 80px 90px, #ffffff77 50%, transparent),
        radial-gradient(1px 1px at 140px 40px, #ffffffaa 50%, transparent),
        radial-gradient(2px 2px at 190px 130px, #ffffff66 50%, transparent);
    background-size: 220px 180px;
    animation: stars 45s linear infinite;
}

@keyframes aurora {
    from { transform: translate(-3%, -2%) scale(1); }
    to { transform: translate(3%, 2%) scale(1.1); }
}

@keyframes stars {
    from { transform: translateY(0); }
    to { transform: translateY(-180px); }
}

.container {
    max-width: 1150px;
    margin: auto;
    text-align: center;
    position: relative;
    z-index: 1;
}

h1 {
    font-size: clamp(25px, 5vw, 42px);
    margin: 15px 0 30px;
    text-shadow: 0 0 20px #668cff;
}

.main {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 35px;
}

.wheel-area {
    position: relative;
    width: min(90vw, 500px);
}

canvas {
    width: 100%;
    height: auto;
    display: block;
    filter: drop-shadow(0 0 25px #526fff66);
}

.pointer {
    position: absolute;
    top: -8px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 5;
    width: 0;
    height: 0;
    border-left: 19px solid transparent;
    border-right: 19px solid transparent;
    border-top: 38px solid #ffcf40;
    filter: drop-shadow(0 3px 5px black);
}

.panel {
    width: min(100%, 400px);
    background: #ffffff12;
    border: 1px solid #ffffff25;
    border-radius: 20px;
    padding: 22px;
    backdrop-filter: blur(12px);
    box-shadow: 0 10px 35px #0003;
}

input {
    width: 100%;
    padding: 13px;
    border: 1px solid #ffffff35;
    border-radius: 10px;
    outline: none;
    background: #101a39;
    color: white;
    font-size: 16px;
    margin: 12px 0 10px;
}

button {
    border: none;
    border-radius: 10px;
    padding: 12px 16px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    transition: .2s;
}

button:hover {
    transform: translateY(-2px);
    filter: brightness(1.15);
}

.add-btn {
    width: 100%;
    color: white;
    background: #4267ed;
}

.spin-btn {
    margin-top: 20px;
    width: min(90vw, 500px);
    padding: 17px;
    border-radius: 14px;
    color: #111;
    background: linear-gradient(90deg, #ffcf40, #ff9f43);
    font-size: 20px;
    box-shadow: 0 5px 20px #ffb52e44;
}

.spin-btn:disabled {
    opacity: .5;
    cursor: not-allowed;
}

.students {
    margin-top: 18px;
    max-height: 210px;
    overflow-y: auto;
    text-align: left;
}

.student {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 9px 11px;
    margin-bottom: 7px;
    border-radius: 8px;
    background: #ffffff12;
}

.delete-btn {
    padding: 5px 10px;
    color: white;
    background: #e74c5e;
}

.lists {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 15px;
    margin-top: 35px;
}

.list-box {
    padding: 18px;
    border-radius: 15px;
    background: #ffffff12;
    border: 1px solid #ffffff20;
    min-height: 150px;
    backdrop-filter: blur(10px);
}

.list-box h2 {
    font-size: 18px;
    margin-bottom: 14px;
}

.list-box p {
    padding: 6px;
    border-bottom: 1px solid #ffffff16;
    overflow-wrap: anywhere;
}

.learned h2 { color: #54e69a; }
.not-learned h2 { color: #ff7777; }
.remaining h2 { color: #ffd45a; }

.stats {
    margin-top: 25px;
    padding: 17px;
    border-radius: 14px;
    background: #ffffff12;
    border: 1px solid #ffffff20;
    font-size: 17px;
    backdrop-filter: blur(10px);
}

.modal {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 10;
    background: #000b;
    justify-content: center;
    align-items: center;
    padding: 15px;
}

.modal-content {
    width: min(100%, 420px);
    background: #17234b;
    border: 1px solid #ffffff35;
    border-radius: 20px;
    padding: 28px;
    text-align: center;
    box-shadow: 0 0 40px #536eff55;
}

.modal-content h2 {
    color: #ffcf40;
    margin-bottom: 15px;
}

#winnerName {
    font-size: 30px;
    font-weight: bold;
    margin: 20px 0;
    overflow-wrap: anywhere;
}

.modal-buttons {
    display: grid;
    gap: 10px;
}

.learn-btn { background: #27ae72; color: white; }
.not-btn { background: #df5260; color: white; }
.keep-btn { background: #4267ed; color: white; }

@media(max-width: 600px) {
    body { padding: 15px 10px; }
    .panel { padding: 16px; }
}
</style>
</head>

<body>

<div class="container">

    <h1>🎡 7-"A" VOCABULARY WHEEL OF NAMES</h1>

    <div class="main">

        <div>
            <div class="wheel-area">
                <div class="pointer"></div>
                <canvas id="wheel" width="600" height="600"></canvas>
            </div>

            <button class="spin-btn" id="spinBtn" onclick="spinWheel()">
                🎯 BARABANNI AYLANTIRISH
            </button>
        </div>

        <div class="panel">
            <h2 style="margin-bottom:15px">👨‍🎓 O‘quvchilar</h2>

            <input id="studentInput"
                   type="text"
                   placeholder="O‘quvchi ismini kiriting">

            <button class="add-btn" onclick="addStudent()">
                + O‘quvchi qo‘shish
            </button>

            <div class="students" id="studentList"></div>
        </div>

    </div>

    <div class="lists">

        <div class="list-box remaining">
            <h2>🎡 BARABANDA</h2>
            <div id="remainingList"></div>
        </div>

        <div class="list-box learned">
            <h2>✅ YODLAGANLAR</h2>
            <div id="learnedList"></div>
        </div>

        <div class="list-box not-learned">
            <h2>❌ YODLAMAGANLAR</h2>
            <div id="notLearnedList"></div>
        </div>

    </div>

    <div class="stats" id="stats">
        O‘quvchilar: 0
    </div>

</div>

<div class="modal" id="winnerModal">
    <div class="modal-content">
        <h2>🎉 TANLANGAN O‘QUVCHI!</h2>
        <div id="winnerName"></div>

        <div class="modal-buttons">
            <button class="learn-btn" onclick="markLearned()">
                ✅ Yodlagan
            </button>

            <button class="not-btn" onclick="markNotLearned()">
                ❌ Yodlamagan
            </button>

            <button class="keep-btn" onclick="keepStudent()">
                🔄 Barabanda qoldirish
            </button>
        </div>
    </div>
</div>

<script>
const canvas = document.getElementById("wheel");
const ctx = canvas.getContext("2d");

const colors = [
    "#4568dc",
    "#9b59b6",
    "#e67e22",
    "#16a085",
    "#e84393",
    "#2980b9",
    "#8e44ad",
    "#27ae60",
    "#d35400",
    "#c0392b"
];

let students = JSON.parse(localStorage.getItem("students")) || [];
let learned = JSON.parse(localStorage.getItem("learned")) || [];
let notLearned = JSON.parse(localStorage.getItem("notLearned")) || [];

let currentRotation = 0;
let spinning = false;
let selectedStudent = null;

function saveData() {
    localStorage.setItem("students", JSON.stringify(students));
    localStorage.setItem("learned", JSON.stringify(learned));
    localStorage.setItem("notLearned", JSON.stringify(notLearned));
}

function drawWheel() {
    const count = students.length;

    ctx.clearRect(0, 0, 600, 600);

    if (count === 0) {
        ctx.beginPath();
        ctx.arc(300, 300, 280, 0, Math.PI * 2);
        ctx.fillStyle = "#26345e";
        ctx.fill();

        ctx.fillStyle = "white";
        ctx.font = "bold 25px Arial";
        ctx.textAlign = "center";
        ctx.fillText("O‘quvchilarni qo‘shing", 300, 310);
        return;
    }

    const slice = Math.PI * 2 / count;

    ctx.save();
    ctx.translate(300, 300);
    ctx.rotate(currentRotation);

    for (let i = 0; i < count; i++) {
        const start = -Math.PI / 2 + i * slice;
        const end = start + slice;

        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.arc(0, 0, 280, start, end);
        ctx.closePath();

        ctx.fillStyle = colors[i % colors.length];
        ctx.fill();

        ctx.strokeStyle = "#ffffffaa";
        ctx.lineWidth = 3;
        ctx.stroke();

        ctx.save();
        ctx.rotate(start + slice / 2);

        ctx.textAlign = "right";
        ctx.textBaseline = "middle";
        ctx.fillStyle = "white";
        ctx.font = "bold 19px Arial";
        ctx.shadowColor = "#000";
        ctx.shadowBlur = 4;

        let name = students[i];
        if (name.length > 18) name = name.slice(0, 16) + "...";

        ctx.fillText(name, 255, 0);
        ctx.restore();
    }

    ctx.restore();

    ctx.beginPath();
    ctx.arc(300, 300, 35, 0, Math.PI * 2);
    ctx.fillStyle = "#ffcf40";
    ctx.fill();
    ctx.strokeStyle = "white";
    ctx.lineWidth = 4;
    ctx.stroke();
}

function renderLists() {
    const studentList = document.getElementById("studentList");
    const remainingList = document.getElementById("remainingList");
    const learnedList = document.getElementById("learnedList");
    const notLearnedList = document.getElementById("notLearnedList");

    studentList.innerHTML = "";
    remainingList.innerHTML = "";
    learnedList.innerHTML = "";
    notLearnedList.innerHTML = "";

    students.forEach((name, index) => {
        const div = document.createElement("div");
        div.className = "student";

        const span = document.createElement("span");
        span.textContent = name;

        const button = document.createElement("button");
        button.className = "delete-btn";
        button.textContent = "✕";
        button.onclick = () => removeStudent(index);

        div.appendChild(span);
        div.appendChild(button);
        studentList.appendChild(div);

        addListItem(remainingList, name);
    });

    learned.forEach(name => addListItem(learnedList, name));
    notLearned.forEach(name => addListItem(notLearnedList, name));

    document.getElementById("stats").textContent =
        "🎓 Barabanda: " + students.length +
        " | ✅ Yodlagan: " + learned.length +
        " | ❌ Yodlamagan: " + notLearned.length;

    document.getElementById("spinBtn").disabled =
        spinning || students.length === 0;

    drawWheel();
}

function addListItem(parent, name) {
    const p = document.createElement("p");
    p.textContent = name;
    parent.appendChild(p);
}

function addStudent() {
    const input = document.getElementById("studentInput");
    const name = input.value.trim();

    if (!name) return;

    if (students.includes(name) ||
        learned.includes(name) ||
        notLearned.includes(name)) {
        alert("Bu o‘quvchi allaqachon ro‘yxatda bor!");
        return;
    }

    students.push(name);
    input.value = "";

    saveData();
    renderLists();
}

function removeStudent(index) {
    if (spinning) return;

    students.splice(index, 1);
    saveData();
    renderLists();
}

document.getElementById("studentInput").addEventListener("keydown", e => {
    if (e.key === "Enter") addStudent();
});

/* TRUE RANDOM SPIN */

function spinWheel() {
    if (spinning || students.length === 0) return;

    spinning = true;
    selectedStudent = null;

    document.getElementById("spinBtn").disabled = true;

    const startRotation = currentRotation;

    // Tasodifiy yakuniy burchak:
    // 0 dan 360 gradusgacha istalgan nuqta.
    const fullSpins = 5 + Math.floor(Math.random() * 4);
    const randomAngle = Math.random() * Math.PI * 2;

    const targetRotation =
        startRotation + fullSpins * Math.PI * 2 + randomAngle;

    const duration = 5500;
    const startTime = performance.now();

    function animate(now) {
        const elapsed = now - startTime;
        const progress = Math.min(elapsed / duration, 1);

        const ease = 1 - Math.pow(1 - progress, 4);

        currentRotation =
            startRotation +
            (targetRotation - startRotation) * ease;

        drawWheel();

        if (progress < 1) {
            requestAnimationFrame(animate);
        } else {
            currentRotation = targetRotation;
            spinning = false;

            // Strelka yuqorida turadi.
            // G'olib strelka ostidagi sektor orqali topiladi.
            const slice = Math.PI * 2 / students.length;

            const pointerAngle = -Math.PI / 2;
            const wheelAngle = pointerAngle - currentRotation;
            const firstSegmentAngle = -Math.PI / 2;

            let relativeAngle =
                (wheelAngle - firstSegmentAngle) % (Math.PI * 2);

            if (relativeAngle < 0) {
                relativeAngle += Math.PI * 2;
            }

            const winnerIndex = Math.floor(relativeAngle / slice);

            selectedStudent = students[winnerIndex];

            drawWheel();
            showWinner();
            renderLists();
        }
    }

    requestAnimationFrame(animate);
}

function showWinner() {
    if (!selectedStudent) return;

    document.getElementById("winnerName").textContent =
        selectedStudent;

    document.getElementById("winnerModal").style.display = "flex";
}

function closeModal() {
    document.getElementById("winnerModal").style.display = "none";
    selectedStudent = null;
    renderLists();
}

function markLearned() {
    if (!selectedStudent) return;

    students = students.filter(name => name !== selectedStudent);
    learned.push(selectedStudent);

    saveData();
    closeModal();
}

function markNotLearned() {
    if (!selectedStudent) return;

    students = students.filter(name => name !== selectedStudent);
    notLearned.push(selectedStudent);

    saveData();
    closeModal();
}

function keepStudent() {
    closeModal();
}

renderLists();
</script>

</body>
</html>
