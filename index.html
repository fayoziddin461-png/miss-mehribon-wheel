<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>7-"A" VOCABULARY WHEEL OF NAMES</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    font-family: Arial, sans-serif;
    color: white;
}

body {
    min-height: 100vh;
    overflow-x: hidden;
    background:
        radial-gradient(circle at 20% 20%, #351b70, transparent 35%),
        radial-gradient(circle at 80% 80%, #092b65, transparent 35%),
        linear-gradient(135deg, #050816, #101b42, #07152d);
    background-size: 200% 200%;
    animation: backgroundMove 12s ease infinite;
}

@keyframes backgroundMove {
    0% { background-position: 0% 0%; }
    50% { background-position: 100% 100%; }
    100% { background-position: 0% 0%; }
}

#particles {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 0;
}

.aurora {
    position: fixed;
    width: 450px;
    height: 450px;
    border-radius: 50%;
    filter: blur(90px);
    opacity: 0.25;
    pointer-events: none;
    z-index: 0;
}

.aurora.one {
    background: #7c3cff;
    top: -150px;
    left: -100px;
}

.aurora.two {
    background: #00d9ff;
    right: -150px;
    top: 25%;
}

.aurora.three {
    background: #ff1493;
    bottom: -200px;
    left: 35%;
}

.container {
    position: relative;
    z-index: 2;
    width: min(1200px, 95%);
    margin: auto;
    padding: 25px 0 50px;
}

header {
    text-align: center;
    margin-bottom: 25px;
}

h1 {
    margin: 0;
    font-size: clamp(25px, 5vw, 48px);
    text-shadow: 0 0 10px #00d9ff, 0 0 25px #006eff;
}

.subtitle {
    margin-top: 8px;
    color: #9feaff;
    letter-spacing: 2px;
    font-size: 14px;
}

.main {
    display: grid;
    grid-template-columns: 1fr 360px;
    gap: 25px;
    align-items: start;
}

.card {
    background: rgba(8, 15, 40, 0.72);
    border: 1px solid rgba(0, 217, 255, 0.3);
    border-radius: 25px;
    padding: 25px;
    box-shadow:
        0 0 25px rgba(0, 217, 255, 0.12),
        inset 0 0 30px rgba(255,255,255,0.02);
    backdrop-filter: blur(15px);
}

.wheel-area {
    display: flex;
    flex-direction: column;
    align-items: center;
}

.pointer {
    width: 0;
    height: 0;
    border-left: 18px solid transparent;
    border-right: 18px solid transparent;
    border-top: 38px solid #ff315d;
    filter: drop-shadow(0 0 10px #ff315d);
    margin-bottom: -5px;
    position: relative;
    z-index: 5;
}

.wheel-wrapper {
    position: relative;
    width: min(550px, 90vw);
    aspect-ratio: 1;
}

#wheel {
    width: 100%;
    height: 100%;
    display: block;
    border-radius: 50%;
    filter:
        drop-shadow(0 0 15px rgba(0,217,255,.7))
        drop-shadow(0 0 35px rgba(124,60,255,.35));
}

.spin-btn {
    margin-top: 25px;
    border: none;
    border-radius: 50px;
    padding: 16px 45px;
    font-size: 20px;
    font-weight: bold;
    color: white;
    cursor: pointer;
    background: linear-gradient(135deg, #00bfff, #7040ff);
    box-shadow:
        0 0 15px rgba(0,191,255,.6),
        0 0 35px rgba(112,64,255,.3);
    transition: .2s;
}

.spin-btn:hover {
    transform: scale(1.05);
}

.spin-btn:disabled {
    opacity: .5;
    cursor: not-allowed;
}

.side-title {
    font-size: 20px;
    margin-bottom: 15px;
    color: #8eeaff;
    font-weight: bold;
}

.students {
    max-height: 230px;
    overflow-y: auto;
    padding-right: 4px;
}

.student-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 9px;
    margin-bottom: 7px;
    border-radius: 12px;
    background: rgba(255,255,255,.05);
    transition: .2s;
}

.student-row:hover {
    background: rgba(255,255,255,.09);
    transform: translateX(3px);
}

.student-name {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.delete-btn {
    width: 28px;
    height: 28px;
    border: none;
    border-radius: 8px;
    background: #e9294f;
    color: white;
    font-size: 19px;
    cursor: pointer;
    line-height: 28px;
    transition: .2s;
}

.delete-btn:hover {
    background: #ff1744;
    transform: scale(1.08);
}

.add-box {
    display: flex;
    gap: 8px;
    margin-top: 15px;
}

.add-box input {
    min-width: 0;
    flex: 1;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid #2e8cff;
    outline: none;
    background: rgba(0,0,0,.3);
    color: white;
    font-size: 14px;
}

.add-box input::placeholder {
    color: #8c9ab8;
}

.add-box button {
    border: none;
    border-radius: 10px;
    padding: 0 15px;
    background: #00bfff;
    color: white;
    font-size: 22px;
    font-weight: bold;
    cursor: pointer;
    transition: .2s;
}

.add-box button:hover {
    transform: scale(1.05);
    background: #19caff;
}

.stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 20px;
}

.stat {
    padding: 15px;
    border-radius: 15px;
    text-align: center;
    background: rgba(255,255,255,.05);
}

.stat-number {
    display: block;
    font-size: 25px;
    font-weight: bold;
    color: #62eaff;
}

.stat-label {
    font-size: 12px;
    color: #aaa;
}

.overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.7);
    backdrop-filter: blur(8px);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 100;
    padding: 20px;
}

.overlay.show {
    display: flex;
}

.popup {
    width: min(450px, 95%);
    background: #0b1430;
    border: 1px solid #22d3ee;
    border-radius: 25px;
    padding: 30px;
    text-align: center;
    box-shadow: 0 0 40px rgba(0,217,255,.35);
}

.popup h2 {
    margin-top: 0;
    color: #70eaff;
}

.winner {
    font-size: 32px;
    font-weight: bold;
    margin: 20px 0;
    color: #fff;
    text-shadow: 0 0 15px #00d9ff;
}

.popup-buttons {
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
}

.popup-buttons button {
    border: none;
    padding: 12px 18px;
    border-radius: 12px;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

.learned-btn { background: #16a34a; }
.notlearned-btn { background: #dc2626; }
.keep-btn { background: #2563eb; }

.confirm-buttons {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-top: 20px;
}

.confirm-buttons button {
    border: none;
    padding: 12px 25px;
    border-radius: 12px;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

.yes-btn { background: #e9294f; }
.no-btn { background: #334155; }

#confetti {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 90;
}

@media (max-width: 850px) {
    .main {
        grid-template-columns: 1fr;
    }

    .card {
        padding: 18px;
    }

    .students {
        max-height: 200px;
    }
}
</style>
</head>
